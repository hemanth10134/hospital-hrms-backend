server:
  port: ${PORT:8081}

spring:
  application:
    name: manpower-planning-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hrms_manpower_planning}
    username: ${DB_USERNAME:hrms_user}
    password: ${DB_PASSWORD:hrms_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  # Comma-separated list of allowed browser origins for CORS. Override in production
  # with the deployed frontend's URL, e.g. https://manpower-planning.example.com
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.hospital.manpower: DEBUG
